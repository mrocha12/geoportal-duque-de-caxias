name: Publicar Geoportal no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do projeto
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar projeto
        run: node scripts/validate-project.mjs
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Aguardar disponibilização do artefato
        run: sleep 15
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4