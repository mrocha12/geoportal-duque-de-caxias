<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130f"/>
      <stop offset="0.48" stop-color="#0b2a24"/>
      <stop offset="1" stop-color="#07130f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#1b8d7f" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#0b5048" stop-opacity=".12"/>
      <stop offset="1" stop-color="#020b08" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#6de4d0" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.6" fill="#9af3e3" fill-opacity=".18"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- abstract cartographic terrain masses; deliberately not a copy of the reference -->
  <g fill="#0e4840" fill-opacity=".62" stroke="#2daa98" stroke-opacity=".28" stroke-width="2">
    <path d="M-40 230 C160 150 250 245 390 170 C530 94 650 140 735 250 C815 355 690 430 550 420 C405 410 330 500 185 455 C80 422 25 350-40 230Z"/>
    <path d="M1980 210 C1810 125 1695 220 1575 145 C1455 70 1320 145 1270 260 C1220 370 1340 420 1480 398 C1610 377 1690 480 1810 445 C1900 420 1950 330 1980 210Z"/>
    <path d="M-60 850 C110 760 250 825 350 755 C480 665 625 735 675 850 C720 950 605 1035 455 1000 C305 965 220 1040 70 1000 C10 982-30 920-60 850Z"/>
    <path d="M1980 820 C1820 745 1710 805 1600 740 C1480 670 1350 760 1325 870 C1300 975 1435 1035 1565 1000 C1695 965 1790 1040 1900 990 C1950 968 1970 900 1980 820Z"/>
  </g>

  <!-- contour lines -->
  <g fill="none" stroke="#67d5c4" stroke-opacity=".20" stroke-width="2">
    <path d="M-50 300 C170 190 285 330 430 220 C565 118 700 205 790 310 C865 398 765 505 600 470 C430 435 345 555 190 515 C80 485 20 395-50 300Z"/>
    <path d="M-50 345 C150 250 275 365 425 275 C560 195 675 260 740 335 C790 395 705 455 580 438 C430 418 340 520 210 490 C100 465 40 410-50 345Z"/>
    <path d="M1970 285 C1790 195 1690 330 1550 235 C1425 150 1300 235 1235 325 C1175 410 1285 485 1420 450 C1570 410 1680 525 1815 485 C1900 460 1940 370 1970 285Z"/>
    <path d="M1970 340 C1800 270 1690 380 1560 300 C1435 225 1335 295 1280 350 C1230 400 1325 445 1435 425 C1570 395 1680 495 1805 455 C1890 430 1935 385 1970 340Z"/>
    <path d="M0 875 C160 785 260 880 380 800 C500 720 610 790 670 870"/>
    <path d="M1920 875 C1780 785 1680 875 1570 800 C1460 730 1370 790 1320 875"/>
  </g>

  <!-- subtle transportation / network lines -->
  <g fill="none" stroke="#7ef0df" stroke-opacity=".25" stroke-width="3">
    <path d="M130 760 C330 610 470 680 650 525 C820 380 1030 450 1190 325 C1370 185 1510 300 1760 145"/>
    <path d="M40 160 C280 290 450 190 620 315 C820 460 980 350 1160 485 C1370 640 1560 520 1880 690"/>
  </g>
  <g fill="#b8faf0" fill-opacity=".65">
    <circle cx="650" cy="525" r="5"/><circle cx="820" cy="380" r="4"/><circle cx="1190" cy="325" r="5"/><circle cx="1510" cy="300" r="4"/>
    <circle cx="620" cy="315" r="4"/><circle cx="1160" cy="485" r="5"/><circle cx="1560" cy="520" r="4"/>
  </g>

  <!-- central atmospheric glow -->
  <ellipse cx="960" cy="535" rx="690" ry="380" fill="#2c9bc2" fill-opacity=".08" filter="url(#blur)"/>
  <rect width="1920" height="1080" fill="#020b08" fill-opacity=".26"/>
</svg>
